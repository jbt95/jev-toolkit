# Leadline configuration for the small Jev ask/verify toolkit.

[analysis]
exclude = ["tools/**", "coverage/**"]

[thresholds.function]
cognitive = 20
cyclomatic = 15
max_nesting = 5

[regressions]
cognitive = 2
cyclomatic = 2
max_nesting = 0
crap = 3.0

[duplication]
min_tokens = 100
min_lines = 10

[[architecture.rules]]
name = "core-does-not-depend-on-surfaces"
source = "src/core/**"
deny = ["src/cli/**", "src/mcp/**"]
severity = "error"
